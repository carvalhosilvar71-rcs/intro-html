<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="descrição" content="Site sobre elementos Iframes. Inline Frame para embutir outros sites">
    <title> Sobre Iframes | HTML </title>
</head>

<body>
    <h1>Iframe</h1>
    <hr>

    <h2>Para que serve?</h2>
    <p> O Inline Frame é um elemento que nos permite embutir outro documento ou conteúdo externo dentro da nossa página. É bastante usado para Youtube, Google Maps, Formulários externos e etc.</p>

    <h3>Exemplo básico de iframe</h3>
    <iframe src="04-imagens.html" frameborder="0"></iframe>
    
    <hr>
    <h3>Carregando o Youtube</h3>

    <iframe
        width="350"
        height="200"
        src="https://www.youtube.com/embed/7AQVRkmgETU" 
        title="Cyberchase - Abertura e Encerramento (TV Cultura)" 
        frameborder="0" 
        allow="accelerometer; autoplay; clipboard-write;encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen>
    </iframe>" 

    <h3> Carregando mapas <h3>
        <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3656.34906391522!2d-46.682729124668946!3d-23.59181107877888!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x94ce5768797c7de1%3A0x42a3240ea81f0386!2sInstituto%20PROA!5e0!3m2!1spt-BR!2sbr!4v1790198498104!5m2!1spt-BR!2sbr" 
        width="600" 
        height="250" 
        style="border:0;" 
        allowfullscreen=""
        loading="lazy" 
        referrerpolicy="strict-origin-when-cross-origin"></iframe> 
        
        
<iframe src="folheto-rafa.pdf" frameborder="350"></iframe>
</body>
</html>
